name: H9Remote
options:
  bundleIdPrefix: com.h9au
  deploymentTarget:
    macOS: "13.0"

packages:
  H9RemoteCore:
    path: H9RemoteCore

targets:
  H9Remote:
    type: application
    platform: macOS
    sources:
      - path: H9Remote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.h9au.H9Remote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: H9Remote/H9Remote.entitlements
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - script: |
          set -e

          PLUGIN_DIR="$HOME/Library/Audio/Plug-Ins/Components"
          APPEX_NAME="H9RemoteExtension.appex"
          BUILT_APP="$BUILT_PRODUCTS_DIR/H9Remote.app"
          BUILT_APPEX="$BUILT_APP/Contents/PlugIns/$APPEX_NAME"
          TARGET_PLUGIN="$PLUGIN_DIR/$APPEX_NAME"

          mkdir -p "$PLUGIN_DIR"

          if [ -d "$BUILT_APPEX" ]; then
            echo "Installing AU plugin..."
            rm -rf "$TARGET_PLUGIN"
            cp -r "$BUILT_APPEX" "$TARGET_PLUGIN"
            echo "✓ AU plugin installed to $PLUGIN_DIR"
          fi
        name: "Install AU Plugin"
    dependencies:
      - target: H9RemoteExtension
        embed: true
        codeSign: true
      - package: H9RemoteCore
        product: H9RemoteCore

  H9RemoteExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: H9RemoteExtension
    info:
      path: H9RemoteExtension/Info.plist
      properties:
        CFBundleDisplayName: H9 Remote
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).H9AudioUnitViewController
          NSExtensionAttributes:
            AudioComponents:
              - name: "H9Au: H9 Remote"
                description: "Remote control surface for the Eventide H9 (MIDI CC/SysEx only, no audio DSP)"
                factoryFunction: H9AudioUnitViewController
                manufacturer: H9Au
                type: aumi
                subtype: H9rm
                version: 1
                sandboxSafe: true
                tags:
                  - MIDI
                  - Effects
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.h9au.H9Remote.H9RemoteExtension
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: H9RemoteExtension/H9RemoteExtension.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: H9RemoteCore
        product: H9RemoteCore

schemes:
  H9Remote:
    build:
      targets:
        H9Remote: all
        H9RemoteExtension: all
    run:
      config: Debug
    test:
      config: Debug
